name: Gerar APK Gian Studio

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK 35
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Nenhum arquivo ZIP foi encontrado na raiz do repositorio."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/extracted" -name settings.gradle.kts | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle.kts nao foi encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Compilar base AudioFX
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :audiofxbase:assembleDebug --stacktrace --no-daemon

      - name: Incorporar base nativa
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          python3 tools/prepare_compiler_asset.py --base-apk audiofxbase/build/outputs/apk/debug/audiofxbase-debug.apk --template tools/compiler_v037_original.html --output compiler/src/main/assets/www/index.html

      - name: Compilar Gian Studio
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          ./gradlew :compiler:assembleDebug --stacktrace --no-daemon

      - name: Preparar APK final
        shell: bash
        run: |
          set -e
          APK_FILE="$(find "$PROJECT_DIR/compiler/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "O APK compilado nao foi encontrado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/output/Gian_Studio_Offline_Compiler_v0_3_8_NATIVE_AUDIOFX.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gian-Studio-v0.3.8-Native-AudioFX
          path: output/Gian_Studio_Offline_Compiler_v0_3_8_NATIVE_AUDIOFX.apk
          if-no-files-found: error
